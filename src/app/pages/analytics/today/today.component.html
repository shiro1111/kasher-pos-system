<div class="summary-page">
    <!-- Header: title + date filter -->
    <div class="flex flex-column md:flex-row md:align-items-center md:justify-content-between mb-4">
        <div>
            <div class="text-2xl font-bold">Summary</div>
            <div class="text-sm font-light muted mt-1">{{ selectedDate | date: 'dd/MM/yyyy (EEEE)' }}</div>
        </div>
        <div class="box-shadow p-3 bg-white border-round-2xl flex align-items-end gap-2 mt-3 md:mt-0">
            <div class="filter-field">
                <label class="text-xs font-light muted">Date</label>
                <p-datepicker [(ngModel)]="selectedDate" dateFormat="dd/mm/yy" [iconDisplay]="'input'"
                    [showIcon]="true" [readonlyInput]="true" appendTo="body" class="mt-1" />
            </div>
            <p-button (onClick)="onSearchClicked()" icon="pi pi-search" label="Search"></p-button>
        </div>
    </div>

    <!-- Scrollable content below header -->
    <div class="scroll-area">
        <!-- Stats strip -->
        <div class="flex flex-wrap gap-3 mb-4" *ngIf="todaySummary.length">
            <div class="box-shadow p-3 bg-white border-round-2xl flex align-items-center gap-3 stat-card">
                <div class="stat-icon"><span class="pi pi-shopping-bag"></span></div>
                <div>
                    <div class="text-xs font-light muted">Items sold</div>
                    <div class="font-bold text-xl">{{ totalSold }}</div>
                </div>
            </div>
            <div class="box-shadow p-3 bg-white border-round-2xl flex align-items-center gap-3 stat-card">
                <div class="stat-icon"><span class="pi pi-list"></span></div>
                <div>
                    <div class="text-xs font-light muted">Product types</div>
                    <div class="font-bold text-xl">{{ todaySummary.length }}</div>
                </div>
            </div>
        </div>

        <!-- Ranked list -->
        <div class="box-shadow bg-white border-round-2xl p-4">
            <div class="font-bold text-lg mb-3">Top selling</div>

            <div *ngIf="!todaySummary.length" class="empty-state">
                <i class="pi pi-inbox text-4xl muted"></i>
                <div class="mt-2 font-light muted">No sales for this date</div>
            </div>

            <div *ngFor="let item of todaySummary; let i = index" class="summary-row">
                <div class="rank-badge" [ngClass]="{ 'rank-top': i < 3 }">{{ i + 1 }}</div>
                <div class="flex-1 font-medium">{{ item.name }}</div>
                <div class="sold-badge">{{ item.sold }} sold</div>
            </div>
        </div>
    </div>
</div>
